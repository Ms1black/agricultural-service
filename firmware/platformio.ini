; Сборка: cd firmware && pio run
; Прошивка: pio run -t upload · монитор порта: pio device monitor
[platformio]
src_dir = autopoliv_ui

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX
    adafruit/Adafruit AHTX0
    bblanchon/ArduinoJson@7.4.2
