name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # secrets.h нет в репозитории — прошивка собирается с пустыми настройками (режим настройки)
      - run: pio run
        working-directory: firmware
      # Варианты вывода звука (V2) и прошивка без голоса тоже должны собираться
      - run: |
          for flags in "-DAUDIO_OUT=AUDIO_PDM" "-DAUDIO_OUT=AUDIO_I2S_MAX98357" "-DVOICE_ENABLED=0" "-DWAKE_ENABLED=0"; do
            PLATFORMIO_BUILD_FLAGS="$flags" pio run || exit 1
          done
        working-directory: firmware

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build      # проверка типов + сборка

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: server/.env для проверки
        run: |
          cp server/.env.example server/.env
          {
            echo PLANT_TOKEN=ci-token
            echo PLANT_WEB_PASSWORD=ci-pass
            echo VOICE_PRELOAD=0
            echo ML_RETRAIN_HOURS=0
          } >> server/.env
      - run: docker compose up -d --build
      # Оба контейнера поднялись; вход по паролю и API устройства работают через nginx
      - run: |
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = 401
          curl -fs -u admin:ci-pass localhost:8000/ | grep -q '<div id="root">'
          curl -fs -u admin:ci-pass localhost:8000/web/api/assistant
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/web/api/state)" = 401
          body='{"device":"ci","soil_raw":2500,"soil_pct":50,"soil_ok":true,"soil_dry":false}'
          curl -fs -X POST -H 'Content-Type: application/json' -H 'X-Api-Key: ci-token' -d "$body" localhost:8000/api/telemetry | grep -q '"command":"none"'
      - if: failure()
        run: docker compose logs
