name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # secrets.h нет в репозитории — прошивка собирается с secrets.example.h
      - run: pio run
        working-directory: firmware

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t plant-service server
      # Контейнер должен стартовать и пройти /health
      - run: |
          docker run -d --name plant -p 8000:8000 \
            -e PLANT_TOKEN=ci -e PLANT_WEB_PASSWORD=ci plant-service
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs plant; exit 1
